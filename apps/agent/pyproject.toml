[project]
name = "agent-builder"
version = "0.1.0"
description = "LiveKit voice agent worker: loads versioned agent configs and runs them on GPT-Live"
requires-python = ">=3.12"
dependencies = [
    "livekit-agents[openai,google]~=1.8",
    "mcp>=1.29,<2",
    "pydantic>=2.14",
    "python-dotenv>=1.0",
]

[project.scripts]
agent-builder = "agent_builder.worker:main"
agent-builder-api = "agent_builder.api:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"
